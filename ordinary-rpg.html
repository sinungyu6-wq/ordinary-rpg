<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101a27"><title>평범한 RPG</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a27;color:#f5f7fa;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#game{display:block;width:100vw;height:100dvh;image-rendering:pixelated}#hud{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 10px);right:12px;pointer-events:none;display:flex;justify-content:space-between;gap:10px;font-size:12px;text-shadow:0 2px 3px #000} .panel{background:#111a27d9;border:1px solid #ffffff2a;border-radius:12px;padding:9px 11px;min-width:130px;box-shadow:0 4px 14px #0004}.bar{height:8px;background:#263447;border-radius:8px;overflow:hidden;margin:4px 0 6px}.fill{height:100%;width:100%;transition:width .15s}.hp{background:#ff5b68}.mp{background:#54b9ff}.xp{background:#ffc857}.right{text-align:right}.small{opacity:.8;font-size:11px}#quest{position:fixed;top:120px;left:50%;transform:translateX(-50%);background:#101a27c9;border:1px solid #f7c85c66;border-radius:9px;padding:7px 12px;font-size:12px;white-space:nowrap;pointer-events:none}#controls{position:fixed;inset:auto 0 calc(env(safe-area-inset-bottom) + 14px);height:140px;pointer-events:none}.joy{position:absolute;left:18px;bottom:0;width:122px;height:122px;border-radius:50%;background:#dbeafe18;border:2px solid #ffffff45;pointer-events:auto;touch-action:none}.knob{position:absolute;left:36px;top:36px;width:46px;height:46px;border-radius:50%;background:#dbeafe55;border:2px solid #ffffff8c}.actions{position:absolute;right:14px;bottom:0;display:flex;align-items:flex-end;gap:8px;pointer-events:auto}.btn{border:1px solid #ffffff66;border-radius:50%;color:white;font-weight:800;background:#2d4665d9;box-shadow:0 5px 12px #0005;touch-action:none;width:57px;height:57px;font-size:12px}.btn.attack{width:76px;height:76px;background:#c84754df}.btn.skill{background:#236fa9df}.btn.potion{background:#21865cdf}#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);font-size:20px;font-weight:900;text-shadow:0 3px 5px #000;pointer-events:none;text-align:center;white-space:pre-line}#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#08121ad9,#101a27ee);padding:25px}#card{max-width:380px;width:100%;border:1px solid #ffffff30;border-radius:20px;padding:25px;background:#172638f2;text-align:center;box-shadow:0 20px 60px #0008}h1{margin:0 0 6px;font-size:30px}#card p{color:#c2d0df;line-height:1.65;font-size:14px}#play{border:0;border-radius:12px;background:#f4c45e;color:#1a2632;font-weight:900;font-size:17px;padding:14px 24px;width:100%;margin-top:8px}#help{font-size:11px!important;opacity:.8}
#extras{position:fixed;left:50%;top:154px;transform:translateX(-50%);display:flex;gap:5px;flex-wrap:wrap;justify-content:center;width:min(96vw,540px);pointer-events:auto}.mini{border:1px solid #ffffff55;border-radius:9px;background:#142538e8;color:#fff;padding:7px 9px;font-weight:700;font-size:11px}.modal{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:18px;background:#06101bd9;touch-action:auto}.modalbox{width:min(440px,100%);max-height:82dvh;overflow:auto;background:#172638;border:1px solid #ffffff38;border-radius:18px;padding:18px;box-shadow:0 18px 60px #0009}.modalbox h2{margin:0 0 10px}.modalbox p{font-size:13px;line-height:1.5;color:#d2dce8}.gridbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gridbtn button,.widebtn{background:#263f59;color:#fff;border:1px solid #ffffff33;border-radius:10px;padding:11px;font-weight:700;text-align:left}.gridbtn button span{display:block;font-size:11px;color:#c5d3e3;font-weight:400;margin-top:4px}.widebtn{width:100%;margin-top:8px;text-align:center;background:#b98237;color:#111}.regiontag{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-size:11px;background:#111a27bb;padding:5px 9px;border-radius:8px;pointer-events:none}#hud{z-index:1}#extras{z-index:2}#controls{z-index:2}#toast{z-index:3}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="panel"><b id="level">Lv. 1 용사</b><div class="bar"><div id="hp" class="fill"></div></div><div class="bar"><div id="mp" class="fill"></div></div><div class="bar"><div id="xp" class="fill"></div></div><div class="small" id="stats">HP 60/60 · MP 30/30</div></div><div class="panel right"><b>🪙 <span id="gold">0</span> G</b><div style="margin-top:6px">🧪 포션 <span id="potions">3</span></div><div class="small" id="kills">처치 0 / 5</div></div></div><div id="quest">🌿 숲의 슬라임을 처치하자! (0/5)</div><div id="toast"></div><div class="regiontag" id="regiontag">🌿 초록숲</div><div id="extras"><button class="mini" data-panel="character">🧝 종족</button><button class="mini" data-panel="gear">⚔️ 장비</button><button class="mini" data-panel="shop">🛒 상점</button><button class="mini" data-panel="skills">✨ 스킬</button><button class="mini" data-panel="dungeon">🏰 던전</button><button class="mini" data-panel="travel">🗺️ 지역</button><button class="mini" data-panel="questlog">📜 퀘스트</button><button class="mini" id="saveBtn">💾 저장</button><button class="mini" id="loadBtn">📂 불러오기</button></div><div id="modal" class="modal"><div class="modalbox"><h2 id="modalTitle">모험 메뉴</h2><div id="modalBody"></div><button class="widebtn" id="closeModal">닫기</button></div></div><div id="controls"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="actions"><button class="btn potion" id="potion">🧪<br>포션</button><button class="btn skill" id="skill">🔥<br>스킬</button><button class="btn attack" id="attack">⚔️<br>공격</button></div></div><div id="start"><div id="card"><div style="font-size:48px">🗡️</div><h1>평범한 RPG</h1><div style="color:#f4c45e;font-size:12px;letter-spacing:2px">PIXEL ADVENTURE</div><p>숲을 탐험하고 몬스터를 처치해 레벨을 올려 봐!<br>왼쪽 조이스틱으로 이동하고 오른쪽 버튼으로 싸워.</p><p id="help">공격: 주변 몬스터 타격 · 스킬: 파이어볼(MP 8)<br>포션: HP 회복 · 레벨업하면 더 강해져!</p><button id="play">모험 시작하기</button></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const world={w:1800,h:1300};let running=false,last=0,toastT=0,attackT=0,skillT=0,spawnT=0;const p={x:350,y:340,r:15,dirX:0,dirY:1,hp:60,maxhp:60,mp:30,maxmp:30,lv:1,xp:0,next:25,atk:8,def:1,gold:0,potions:3,inv:0};let kills=0,enemies=[],fireballs=[],particles=[];const trees=[];for(let i=0;i<90;i++){let x=80+(i*197%1640),y=80+(i*313%1140);if(Math.hypot(x-p.x,y-p.y)>110)trees.push({x,y,r:15+(i%4)*3})}function enemy(){let types=[['슬라임','#72d96c',20,4,55,8,5],['고블린','#d39b57',32,7,72,14,10],['박쥐','#b48aff',16,5,92,11,8]],t=types[Math.floor(Math.random()*types.length)],a=Math.random()*Math.PI*2,dist=230+Math.random()*300;return{x:Math.max(30,Math.min(world.w-30,p.x+Math.cos(a)*dist)),y:Math.max(30,Math.min(world.h-30,p.y+Math.sin(a)*dist)),r:15,type:t[0],color:t[1],hp:t[2],maxhp:t[2],atk:t[3],speed:t[4],exp:t[5],gold:t[6],cd:0,w:Math.random()*6}}for(let i=0;i<13;i++)enemies.push(enemy());
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function say(s){document.getElementById('toast').textContent=s;toastT=1.2}function bar(id,n){document.getElementById(id).style.width=clamp(n,0,1)*100+'%'}function updateHud(){document.getElementById('level').textContent='Lv. '+p.lv+' 용사';bar('hp',p.hp/p.maxhp);bar('mp',p.mp/p.maxmp);bar('xp',p.xp/p.next);document.getElementById('stats').textContent=`HP ${Math.ceil(p.hp)}/${p.maxhp} · MP ${Math.floor(p.mp)}/${p.maxmp}`;document.getElementById('gold').textContent=p.gold;document.getElementById('potions').textContent=p.potions;document.getElementById('kills').textContent=`처치 ${kills} / 5`;document.getElementById('quest').textContent=kills>=5?'✨ 퀘스트 완료! 숲의 영웅이 됐어!':`🌿 숲의 몬스터를 처치하자! (${kills}/5)`}function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=30+Math.random()*120;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.45+Math.random()*.35,color})}}function levelup(){while(p.xp>=p.next){p.xp-=p.next;p.lv++;p.next=Math.floor(p.next*1.5);p.maxhp+=15;p.maxmp+=8;p.atk+=3;p.def++;p.hp=p.maxhp;p.mp=p.maxmp;say('LEVEL UP!  ✨\n레벨 '+p.lv);burst(p.x,p.y,'#ffd166',20)}}function damageEnemy(e,d,x,y){e.hp-=d;burst(e.x,e.y,'#ffe2a8',5);particles.push({x:e.x,y:e.y-18,vy:-35,vx:0,t:.65,color:'#fff',text:'-'+d});if(e.hp<=0){p.xp+=e.exp;p.gold+=e.gold;kills++;say(e.type+' 처치! +'+e.exp+' EXP');burst(e.x,e.y,e.color,16);enemies=enemies.filter(a=>a!==e);levelup();updateHud()}}function melee(){if(!running||attackT>0)return;attackT=.38;let hit=false;for(const e of [...enemies]){let dx=e.x-p.x,dy=e.y-p.y,dist=Math.hypot(dx,dy),dot=(dx*p.dirX+dy*p.dirY)/(dist||1);if(dist<67&&(dot>-.2||dist<32)){damageEnemy(e,p.atk+Math.floor(Math.random()*3));hit=true}}burst(p.x+p.dirX*37,p.y+p.dirY*37,'#f7e4a2',hit?8:3)}function fire(){if(!running||skillT>0)return;if(p.mp<8){say('MP가 부족해!');return}p.mp-=8;skillT=.6;fireballs.push({x:p.x+p.dirX*20,y:p.y+p.dirY*20,vx:p.dirX*390,vy:p.dirY*390,t:1.7});updateHud()}function potion(){if(!running)return;if(!p.potions){say('포션이 없어!');return}if(p.hp>=p.maxhp){say('HP가 충분해!');return}p.potions--;p.hp=Math.min(p.maxhp,p.hp+30);say('HP 회복 +30');updateHud()}
let keys={},joy={x:0,y:0},joyOn=false,joyId=null;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();melee()}if(e.key.toLowerCase()==='k')fire();if(e.key==='1')potion()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);const j=document.getElementById('joy'),knob=document.getElementById('knob');function joyMove(e){let r=j.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=39;if(len>max){dx=dx/len*max;dy=dy/len*max}joy.x=dx/max;joy.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}j.addEventListener('pointerdown',e=>{joyOn=true;joyId=e.pointerId;j.setPointerCapture(e.pointerId);joyMove(e)});j.addEventListener('pointermove',e=>{if(joyOn&&e.pointerId===joyId)joyMove(e)});function joyEnd(){joyOn=false;joy={x:0,y:0};knob.style.transform='translate(0,0)'}j.addEventListener('pointerup',joyEnd);j.addEventListener('pointercancel',joyEnd);const atk=document.getElementById('attack');atk.addEventListener('pointerdown',e=>{e.preventDefault();melee();atk.setPointerCapture(e.pointerId);atk._hold=setInterval(melee,120)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])atk.addEventListener(ev,()=>clearInterval(atk._hold));document.getElementById('skill').addEventListener('pointerdown',e=>{e.preventDefault();fire()});document.getElementById('potion').addEventListener('pointerdown',e=>{e.preventDefault();potion()});document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';running=true;last=performance.now();say('모험을 시작하자!')};
function drawTree(t,cx,cy){let x=t.x-cx+W/2,y=t.y-cy+H/2;ctx.fillStyle='#553e32';ctx.fillRect(x-4,y+2,8,15);ctx.fillStyle='#174d3b';ctx.beginPath();ctx.arc(x,y-5,t.r+4,0,7);ctx.fill();ctx.fillStyle='#26734a';ctx.beginPath();ctx.arc(x-3,y-9,t.r,0,7);ctx.fill();ctx.fillStyle='#39935a';ctx.beginPath();ctx.arc(x-5,y-13,t.r*.55,0,7);ctx.fill()}function drawChar(x,y,color,kind,dirX=0,dirY=1){ctx.save();ctx.translate(x,y);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,11,14,7,0,0,7);ctx.fill();if(kind==='hero'){ctx.fillStyle='#273c66';ctx.fillRect(-10,-5,20,18);ctx.fillStyle='#4778d2';ctx.fillRect(-9,-11,18,17);ctx.fillStyle='#f2c49a';ctx.fillRect(-7,-21,14,13);ctx.fillStyle='#633c29';ctx.fillRect(-8,-23,16,6);ctx.fillStyle='#fff';ctx.fillRect(-4,-16,3,3);ctx.fillRect(3,-16,3,3);ctx.fillStyle='#dfe8f2';ctx.save();ctx.translate(dirX*14,dirY*14);ctx.rotate(Math.atan2(dirY,dirX));ctx.fillRect(0,-2,19,4);ctx.fillStyle='#8a9bac';ctx.fillRect(13,-4,3,8);ctx.restore()}else if(kind==='bat'){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-7,-5);ctx.lineTo(-23,-15);ctx.lineTo(-18,0);ctx.lineTo(-22,8);ctx.lineTo(-5,5);ctx.lineTo(0,-2);ctx.lineTo(6,5);ctx.lineTo(22,8);ctx.lineTo(18,0);ctx.lineTo(23,-15);ctx.lineTo(7,-5);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-5,-5,3,3);ctx.fillRect(3,-5,3,3)}else{ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,-3,15,13,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-7,-8,5,6);ctx.fillRect(3,-8,5,6);ctx.fillStyle='#182230';ctx.fillRect(-5,-6,2,3);ctx.fillRect(5,-6,2,3);if(kind==='goblin'){ctx.fillStyle='#d6b06a';ctx.fillRect(-8,-18,16,7)}}ctx.restore()}function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-last)/1000||0,.04);last=now;if(running){attackT=Math.max(0,attackT-dt);skillT=Math.max(0,skillT-dt);p.inv=Math.max(0,p.inv-dt);p.mp=Math.min(p.maxmp,p.mp+dt*1.2);toastT=Math.max(0,toastT-dt);document.getElementById('toast').style.opacity=toastT?1:0;let mx=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0)+joy.x,my=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0)+joy.y;let len=Math.hypot(mx,my);if(len>.08){mx/=Math.max(1,len);my/=Math.max(1,len);p.x=clamp(p.x+mx*185*dt,20,world.w-20);p.y=clamp(p.y+my*185*dt,20,world.h-20);p.dirX=mx;p.dirY=my}for(const t of trees){let dx=p.x-t.x,dy=p.y-t.y,d=Math.hypot(dx,dy),min=p.r+t.r*.65;if(d<min&&d>0){p.x+=dx/d*(min-d);p.y+=dy/d*(min-d)}}for(const e of [...enemies]){e.w+=dt;let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy);if(d<240&&d>1){e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}e.cd-=dt;if(d<30&&e.cd<=0&&p.inv<=0){p.hp-=Math.max(1,e.atk-p.def);p.inv=.65;e.cd=.85;burst(p.x,p.y,'#ff6874',7);if(p.hp<=0){p.hp=0;running=false;document.getElementById('start').style.display='flex';document.querySelector('#card h1').textContent='모험 종료';document.querySelector('#card p').innerHTML=`레벨 ${p.lv} · 처치 ${kills}마리<br>다시 도전해 보자!`;document.getElementById('play').textContent='다시 시작하기';document.getElementById('play').onclick=()=>location.reload()}}}spawnT-=dt;if(spawnT<=0&&enemies.length<16){enemies.push(enemy());spawnT=1.5}for(const f of [...fireballs]){f.x+=f.vx*dt;f.y+=f.vy*dt;f.t-=dt;let e=enemies.find(e=>Math.hypot(e.x-f.x,e.y-f.y)<e.r+10);if(e){damageEnemy(e,p.atk*2+Math.floor(Math.random()*5));fireballs=fireballs.filter(a=>a!==f);burst(f.x,f.y,'#ff9b43',12)}else if(f.t<=0)fireballs=fireballs.filter(a=>a!==f)}for(const q of [...particles]){q.x+=(q.vx||0)*dt;q.y+=(q.vy||0)*dt;q.t-=dt;if(q.t<=0)particles=particles.filter(a=>a!==q)}updateHud()}
let cx=clamp(p.x, W/2,world.w-W/2),cy=clamp(p.y,H/2,world.h-H/2);if(world.w<W)cx=world.w/2;if(world.h<H)cy=world.h/2;ctx.clearRect(0,0,W,H);ctx.fillStyle=currentRegion()===0?'#276749':currentRegion()===1?'#9b783d':'#426f83';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-cx,H/2-cy); // tiled forest floor
for(let y=Math.floor((cy-H/2)/48)*48;y<cy+H/2+48;y+=48)for(let x=Math.floor((cx-W/2)/48)*48;x<cx+W/2+48;x+=48){ctx.fillStyle=currentRegion()===0?(((x/48+y/48)%2===0)?'#2c704c':'#2a6b48'):currentRegion()===1?(((x/48+y/48)%2===0)?'#b99a56':'#a88a49'):(((x/48+y/48)%2===0)?'#6194a2':'#568795');ctx.fillRect(x,y,48,48);ctx.fillStyle='#4a8b56';ctx.globalAlpha=.35;ctx.fillRect(x+7,y+10,3,3);ctx.fillRect(x+32,y+29,2,2);ctx.globalAlpha=1} // path
ctx.fillStyle='#92764c';ctx.fillRect(260,0,105,world.h);ctx.fillRect(0,280,world.w,95);ctx.fillStyle='#b59a6c';for(let y=0;y<world.h;y+=28)ctx.fillRect(260,y,105,2);for(let x=0;x<world.w;x+=28)ctx.fillRect(x,280,2,95);
for(const t of trees)drawTree(t,cx,cy); // NPC
ctx.fillStyle='#e7c46a';ctx.beginPath();ctx.arc(320,320,17,0,7);ctx.fill();drawChar(320,320,'#b78c71','npc');ctx.fillStyle='#fff1b2';ctx.font='bold 20px system-ui';ctx.fillText('!',314,292);
for(const e of enemies){if(e.boss){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle='#7e253d';ctx.beginPath();ctx.arc(0,0,31,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e65d76';ctx.beginPath();ctx.arc(0,-5,24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-12,-10,7,7);ctx.fillRect(6,-10,7,7);ctx.fillStyle='#ffd166';ctx.fillRect(-17,-37,34,6);ctx.restore()}else drawChar(e.x,e.y,e.color,(e.type==='박쥐')?'bat':(e.type==='고블린')?'goblin':'slime');ctx.fillStyle='#17212b';ctx.fillRect(e.x-(e.boss?32:17),e.y-(e.boss?48:27),e.boss?64:34,5);ctx.fillStyle='#ff606a';ctx.fillRect(e.x-(e.boss?32:17),e.y-(e.boss?48:27),(e.boss?64:34)*clamp(e.hp/e.maxhp,0,1),5)}for(const f of fireballs){ctx.fillStyle='#ff9d45';ctx.shadowColor='#ff6b2d';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(f.x,f.y,10,0,7);ctx.fill();ctx.shadowBlur=0}drawChar(p.x,p.y,'#4778d2','hero',p.dirX,p.dirY);if(p.inv>0){ctx.strokeStyle='#ffffffaa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,22,0,7);ctx.stroke()}for(const q of particles){ctx.globalAlpha=clamp(q.t*2,0,1);if(q.text){ctx.fillStyle=q.color;ctx.font='bold 14px system-ui';ctx.fillText(q.text,q.x,q.y)}else{ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y,4,4)}}ctx.globalAlpha=1;ctx.restore(); // subtle border
ctx.strokeStyle='#ffffff12';ctx.strokeRect(0,0,W,H)}// 확장 콘텐츠: 종족·장비·상점·스킬·던전·지역·펫·저장
const extra={race:'인간',weapon:'초보자 검',armor:'천 갑옷',weaponAtk:0,armorDef:0,skillPoints:1,skills:{fire:0,power:0,heal:0},pet:{name:'꼬마 슬라임',level:1,cd:0},region:'초록숲',dungeon:false,dungeonWave:0,quest2:0,questBoss:false,questExplore:0};
const regionNames=['초록숲','모래사막','얼음협곡'];
function currentRegion(){return p.x<600?0:p.x<1200?1:2}
function regionSet(i){i=clamp(i,0,2);p.x=[350,900,1500][i];p.y=[340,650,850][i];extra.region=regionNames[i];extra.questExplore=Math.max(extra.questExplore,i);say(['🌿 초록숲에 도착!','🏜️ 뜨거운 모래사막!','❄️ 얼음협곡에 도착!'][i]);updateHud()}
function openPanel(which){const modal=document.getElementById('modal'),title=document.getElementById('modalTitle'),body=document.getElementById('modalBody');modal.style.display='flex';let html='';
if(which==='character'){title.textContent='🧝 종족 선택';html='<p>종족마다 고유한 능력이 있어. 변경하면 능력치가 다시 적용돼.</p><div class="gridbtn"><button data-race="인간">🧑 인간<span>균형 잡힌 능력 · 공격 +2</span></button><button data-race="엘프">🧝 엘프<span>MP +15 · 스킬 피해 +20%</span></button><button data-race="드워프">⛏️ 드워프<span>방어 +3 · 최대 HP +15</span></button><button data-race="수인">🐺 수인<span>이동 속도 +15% · 공격 +1</span></button></div><p>현재 종족: '+extra.race+'</p>'}
if(which==='gear'){title.textContent='⚔️ 장비';html='<p>장비는 공격력과 방어력을 높여 줘.</p><div class="gridbtn"><button data-buy="bronze">🗡️ 청동검 · 45G<span>공격력 +5</span></button><button data-buy="flame">🔥 화염검 · 120G<span>공격력 +12</span></button><button data-buy="leather">🛡️ 가죽 갑옷 · 45G<span>방어력 +3</span></button><button data-buy="icearmor">❄️ 얼음 갑옷 · 120G<span>방어력 +7</span></button></div><p>착용 중: '+extra.weapon+' / '+extra.armor+'<br>추가 능력치: 공격 +'+extra.weaponAtk+' · 방어 +'+extra.armorDef+'</p>'}
if(which==='shop'){title.textContent='🛒 숲속 상점';html='<p>보유 골드: '+p.gold+'G</p><div class="gridbtn"><button data-buy="potion">🧪 포션 · 15G<span>HP 30 회복</span></button><button data-buy="mpotion">🔷 마나 물약 · 18G<span>MP 20 회복</span></button><button data-buy="petfood">🐾 펫 간식 · 35G<span>펫 레벨 +1, 공격 강화</span></button><button data-buy="skillpoint">📘 스킬 책 · 70G<span>스킬 포인트 +1</span></button></div>'}
if(which==='skills'){title.textContent='✨ 스킬 트리';html='<p>남은 스킬 포인트: '+extra.skillPoints+'</p><div class="gridbtn"><button data-skill="power">⚔️ 검술 Lv.'+extra.skills.power+'<span>레벨마다 공격력 +3</span></button><button data-skill="fire">🔥 파이어볼 Lv.'+extra.skills.fire+'<span>스킬 피해 +25% / 레벨</span></button><button data-skill="heal">💚 생명력 Lv.'+extra.skills.heal+'<span>최대 HP +10 / 레벨</span></button></div>'}
if(which==='dungeon'){title.textContent='🏰 도전의 던전';html='<p>던전은 3번의 몬스터 웨이브와 보스전으로 구성돼. 보상을 얻고 나면 마을로 돌아올 수 있어.</p><p>현재 진행: '+(extra.dungeon?('웨이브 '+extra.dungeonWave+'/4'):'입장 대기')+'</p><button class="widebtn" id="enterDungeon">던전 입장 / 다음 웨이브</button><button class="widebtn" id="leaveDungeon">마을로 귀환</button>'}
if(which==='travel'){title.textContent='🗺️ 세계 지도';html='<p>새로운 지역에는 더 강한 몬스터와 보상이 있어.</p><div class="gridbtn"><button data-region="0">🌿 초록숲<span>초보자 지역</span></button><button data-region="1">🏜️ 모래사막<span>중급 몬스터</span></button><button data-region="2">❄️ 얼음협곡<span>강한 몬스터</span></button></div>'}
if(which==='questlog'){title.textContent='📜 모험 일지';html='<p>① 숲의 몬스터 5마리 처치: '+Math.min(kills,5)+'/5</p><p>② 몬스터 12마리 처치: '+Math.min(kills,12)+'/12</p><p>③ 새로운 지역 탐험: '+(extra.questExplore+1)+'/3</p><p>④ 보스 처치: '+(extra.questBoss?'완료':'미완료')+'</p><p>퀘스트 보상은 조건 달성 후 이 메뉴를 열면 지급돼.</p><button class="widebtn" id="claimQuest">완료한 퀘스트 보상 받기</button>'}
body.innerHTML=html;
body.querySelectorAll('[data-race]').forEach(b=>b.onclick=()=>{let race=b.dataset.race;if(extra.race===race){say('이미 선택한 종족이야.');return}extra.race=race;p.maxhp=60+(p.lv-1)*15+(race==='드워프'?15:0)+extra.skills.heal*10;p.maxmp=30+(p.lv-1)*8+(race==='엘프'?15:0);p.atk=8+(p.lv-1)*3+(race==='인간'?2:race==='수인'?1:0)+extra.skills.power*3;p.def=1+(p.lv-1)+(race==='드워프'?3:0)+extra.armorDef;p.hp=Math.min(p.maxhp,p.hp);p.mp=Math.min(p.maxmp,p.mp);say(race+' 종족으로 변경!');openPanel('character');updateHud()});
body.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy,which));body.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>learn(b.dataset.skill));body.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{regionSet(+b.dataset.region);document.getElementById('modal').style.display='none'});
const enter=body.querySelector('#enterDungeon');if(enter)enter.onclick=()=>{extra.dungeon=true;extra.dungeonWave++;if(extra.dungeonWave>4){extra.dungeonWave=1}p.x=900;p.y=650;enemies=[];if(extra.dungeonWave===4){spawnBoss(true);say('던전 보스가 나타났다!')}else{for(let i=0;i<4+extra.dungeonWave;i++)enemies.push(enemy());say('던전 웨이브 '+extra.dungeonWave+' 시작!')}openPanel('dungeon')};const leave=body.querySelector('#leaveDungeon');if(leave)leave.onclick=()=>{extra.dungeon=false;extra.dungeonWave=0;regionSet(0);enemies=[];for(let i=0;i<8;i++)enemies.push(enemy());document.getElementById('modal').style.display='none'};
const claim=body.querySelector('#claimQuest');if(claim)claim.onclick=()=>{let reward=0;if(kills>=5&&!extra.q1){extra.q1=true;reward+=40}if(kills>=12&&!extra.q2){extra.q2=true;reward+=80}if(extra.questExplore>=2&&!extra.q3){extra.q3=true;reward+=100}if(extra.questBoss&&!extra.q4){extra.q4=true;reward+=150}if(reward){p.gold+=reward;say('퀘스트 보상 +'+reward+'G');updateHud();openPanel('questlog')}else say('아직 받을 보상이 없어!')};
}
function buy(item,from){const cost={potion:15,mpotion:18,petfood:35,skillpoint:70,bronze:45,flame:120,leather:45,icearmor:120}[item];if(p.gold<cost){say('골드가 부족해!');return}p.gold-=cost;if(item==='potion')p.potions++;if(item==='mpotion')p.mp=Math.min(p.maxmp,p.mp+20);if(item==='petfood'){extra.pet.level++;say('펫이 성장했어!')}if(item==='skillpoint')extra.skillPoints++;if(item==='bronze'){extra.weapon='청동검';extra.weaponAtk=5}if(item==='flame'){extra.weapon='화염검';extra.weaponAtk=12}if(item==='leather'){extra.armor='가죽 갑옷';extra.armorDef=3}if(item==='icearmor'){extra.armor='얼음 갑옷';extra.armorDef=7}p.atk=8+(p.lv-1)*3+(extra.race==='인간'?2:extra.race==='수인'?1:0)+extra.skills.power*3+extra.weaponAtk;p.def=1+(p.lv-1)+(extra.race==='드워프'?3:0)+extra.armorDef;updateHud();say('구매 완료!');openPanel(from)}
function learn(skill){if(extra.skillPoints<=0){say('스킬 포인트가 부족해!');return}extra.skillPoints--;extra.skills[skill]++;if(skill==='power')p.atk+=3;if(skill==='heal'){p.maxhp+=10;p.hp+=10}say('스킬 레벨 상승!');updateHud();openPanel('skills')}
function spawnBoss(dungeon=false){const boss={x:clamp(p.x+140,40,world.w-40),y:clamp(p.y+30,40,world.h-40),r:30,type:dungeon?'던전 군주':'숲의 고대왕',color:'#d94f63',hp:180+p.lv*35,maxhp:180+p.lv*35,atk:12+p.lv*2,speed:48,exp:100,gold:80,cd:0,w:0,boss:true};enemies.push(boss)}
document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>openPanel(b.dataset.panel)));document.getElementById('closeModal').onclick=()=>document.getElementById('modal').style.display='none';document.getElementById('saveBtn').onclick=()=>{try{localStorage.setItem('ordinaryRPGSave',JSON.stringify({p,kills,extra,region:currentRegion()}));say('💾 저장 완료!')}catch(e){say('저장할 수 없어. 브라우저 저장 설정을 확인해 줘.')}};document.getElementById('loadBtn').onclick=()=>{try{let d=JSON.parse(localStorage.getItem('ordinaryRPGSave'));if(!d){say('저장 데이터가 없어!');return}Object.assign(p,d.p);kills=d.kills||0;Object.assign(extra,d.extra||{});enemies=[];for(let i=0;i<9;i++)enemies.push(enemy());updateHud();say('📂 불러오기 완료!')}catch(e){say('저장 데이터를 불러오지 못했어.')}};
// 기존 전투·레벨업에 확장 능력치를 연결
const oldLevelup=levelup;levelup=function(){oldLevelup();extra.skillPoints++;say('레벨 업! 스킬 포인트 +1')};
const oldDamageEnemy=damageEnemy;damageEnemy=function(e,d,x,y){const wasAlive=e.hp>0;oldDamageEnemy(e,d,x,y);if(wasAlive&&e.hp<=0){if(e.boss){extra.questBoss=true;p.gold+=100;say('👑 보스 격파! 보너스 100G');}if(extra.dungeon&&enemies.length===0&&extra.dungeonWave<4)say('웨이브 완료! 던전 메뉴에서 다음 웨이브로');}};
// 지역별 몬스터 스케일과 펫 자동 공격
const oldEnemy=enemy;enemy=function(){let e=oldEnemy();let r=currentRegion();if(r===1){e.type=['사막 전갈','모래 정령'][Math.floor(Math.random()*2)];e.color=r===1?'#d9a24d':'#d9a24d';e.hp=Math.round(e.hp*1.6);e.maxhp=e.hp;e.atk+=3;e.exp+=8;e.gold+=6}else if(r===2){e.type=['얼음 늑대','서리 망령'][Math.floor(Math.random()*2)];e.color='#83d9ed';e.hp=Math.round(e.hp*2.2);e.maxhp=e.hp;e.atk+=6;e.exp+=18;e.gold+=12}return e};
const oldFrame=frame; // 렌더링은 기존 루프를 유지하고, 별도 보조 루프에서 펫·지역·보스 처리
let petClock=0;function extraLoop(){if(running){const r=currentRegion();document.getElementById('regiontag').textContent=['🌿 초록숲','🏜️ 모래사막','❄️ 얼음협곡'][r]+' · '+extra.race+' · 🐾 펫 Lv.'+extra.pet.level;petClock+=.05;if(petClock>.55){petClock=0;let target=enemies.find(e=>Math.hypot(e.x-p.x,e.y-p.y)<125);if(target){let d=5+extra.pet.level*3;target.hp-=d;particles.push({x:target.x,y:target.y-25,vy:-25,vx:0,t:.5,color:'#a6f4b5',text:'🐾-'+d});if(target.hp<=0)damageEnemy(target,0)}}}requestAnimationFrame(extraLoop)}requestAnimationFrame(extraLoop);
// 버튼으로 언제든 보스 소환할 수 있도록 종족 메뉴에 이벤트도 제공
const bossBtn=document.createElement('button');bossBtn.className='mini';bossBtn.textContent='👑 보스';bossBtn.onclick=()=>{if(!running){say('먼저 모험을 시작해 줘.');return}if(enemies.some(e=>e.boss)){say('보스가 이미 있어!');return}spawnBoss(extra.dungeon);say('⚠️ 보스 출현!')};document.getElementById('extras').insertBefore(bossBtn,document.getElementById('saveBtn'));
requestAnimationFrame(frame);updateHud();
})();
</script></body></html>
